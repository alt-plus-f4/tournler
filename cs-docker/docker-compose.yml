# A fixed-size pool of persistent CS2 servers, one match at a time each (see ../CS2_SERVER_GUIDE.md
# and src/lib/cs2/server-pool.ts).
#
# Every server shares the `x-cs2-server` template below; a service only sets what differs (name,
# ports, passwords). Don't copy blocks by hand: `./add-server.sh` clones the first server's ~50 GB
# game install (copy-on-write where the filesystem supports it), appends a service here and a
# CS2_SERVER_<N>_* block to .env, and prints the CS2_SERVER_POOL entry for the app's own .env.
# add-server.sh appends to the end of this file, so keep the services section last.
#
# On a Linux host you can skip all this and use ./agent instead, which shares ONE install between
# every server with overlayfs and is driven from Admin → Servers.

x-cs2-server: &cs2-server
  image: joedwards32/cs2
  stdin_open: true
  tty: true

# Mounts every server needs (repeated per service, because YAML can't splice a list):
#  - pre.sh/post.sh: the joedwards32/cs2 image runs them from *inside* its data volume; without
#    overriding them it falls back to its own no-op stubs, and settings/pre.sh's Metamod/
#    CounterStrikeSharp/MatchZy install never runs (see CS2_SERVER_GUIDE.md).
#  - MatchZy cfg: Tournler-specific config, notably matchzy_kick_when_no_match_loaded.
#  - custom-counterstrikesharp (read-only): optional from-source build, preferred by pre.sh when
#    present (see README.md); mounted at a separate path so pre.sh can fall back cleanly.

services:
  cs2-dedicated-01:
    <<: *cs2-server
    container_name: cs2-dedicated-01
    environment:
      - SRCDS_TOKEN=${CS2_SERVER_1_TOKEN:-${SRCDS_TOKEN}}
      - CS2_SERVERNAME=${CS2_SERVER_1_NAME:-[Tournler] CS2 Dedicated Server 01}
      - CS2_LAN=0
      - CS2_PORT=${CS2_SERVER_1_PORT:-27015}
      - CS2_RCON_PORT=${CS2_SERVER_1_RCON_PORT:-27016}
      - CS2_PW=${CS2_SERVER_1_PW}
      - CS2_RCONPW=${CS2_SERVER_1_RCONPW}
      - TV_PW=${CS2_SERVER_1_TV_PW}
      - TV_ENABLE=1
      - CS2_MAPGROUP=${CS2_MAPGROUP:-}
      # Only the boot map; once the app loads a match, MatchZy changes level as needed.
      - CS2_STARTMAP=${CS2_SERVER_1_STARTMAP:-de_dust2}
    volumes:
      - ./data/cs2-dedicated-01:/home/steam/cs2-dedicated
      - ./settings/pre.sh:/home/steam/cs2-dedicated/pre.sh
      - ./settings/post.sh:/home/steam/cs2-dedicated/post.sh
      - ./settings/game/csgo/cfg/MatchZy:/home/steam/cs2-dedicated/game/csgo/cfg/MatchZy
      - ./.build-cache/counterstrikesharp-custom:/home/steam/cs2-dedicated/custom-counterstrikesharp:ro
    ports:
      - '${CS2_SERVER_1_PORT:-27015}:${CS2_SERVER_1_PORT:-27015}/tcp'
      - '${CS2_SERVER_1_RCON_PORT:-27016}:${CS2_SERVER_1_RCON_PORT:-27016}/tcp'
      - '${CS2_SERVER_1_PORT:-27015}:${CS2_SERVER_1_PORT:-27015}/udp'
      - '${CS2_SERVER_1_TV_PORT:-27020}:${CS2_SERVER_1_TV_PORT:-27020}/udp'
