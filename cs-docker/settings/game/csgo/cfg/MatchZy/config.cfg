// This config file is executed when MatchZy plugin is loaded
// Do not add commands other than matchzy config console variables
// More configurations and variables will be coming in future updates.

// Whether whitelist is enabled by default or not. Default value: false
// This is the default value, but whitelist can be toggled by admin using .whitelist command
matchzy_whitelist_enabled_default false

// Whether knife round is enabled by default or not. Default value: true
// This is the default value, but knife can be toggled by admin using .roundknife command
matchzy_knife_enabled_default true

// Minimum ready players required to start the match. If set to 0, all connected players have to ready-up to start the match. Default: 2
matchzy_minimum_ready_required 2

// Path of folder in which demos will be saved. If defined, it must not start with a slash and must end with a slash. Set to empty string to use the csgo root.
// Example: matchzy_demo_path MatchZy/
// A folder named MatchZy will be created in csgo folder if it does not exist and will store the recorded demos in it. Default value is MatchZy/ which means demos will be stored in MatchZy/
matchzy_demo_path MatchZy/

// Format of demo filname. You may use {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1} and {TEAM2}
// Demo files will be named according to the format specified. Do not include .dem format, it will be added automatically
// Make sure to keep {TIME} in the format to create a unique demo file everytime.
matchzy_demo_name_format "Match_No{MATCH_ID}_{TIME}_{MAP}_{TEAM1}_vs_{TEAM2}"

// Whether !stop/.stop command is enabled by default or not. Default value: false
// Note: We are using Valve backup system to record and restore the backups. In most of the cases, this should be just fine.
// But in some cases, this may not be reliable hence default value is false
matchzy_stop_command_available true

// Whether to use !pause/.pause command for tactical pause or normal pause (unpauses only when both teams use unpause command, for admin force-unpauses the game)
// Default value: false
matchzy_use_pause_command_for_tactical_pause false

// Whether to keep .tech command enabled or not
// Default value: true
matchzy_enable_tech_pause true

// Tech pause duration in seconds. Set -1 to keep it infinite.
// Default value: 300
matchzy_tech_pause_duration 300

// Max tech pauses allowed.
// Default value: 2
matchzy_max_tech_pauses_allowed 2

// Whether to pause the match after round restore or not. Default value: true
// Players/admins can unpause the match using !unpause/.unpause. (For players, both the teams will have to use unpause command)
matchzy_pause_after_restore true

// Chat prefix to show whenever a MatchZy message is sent to players. Default value: [{Green}MatchZy{Default}]
// Available Colors: {Default}, {Darkred}, {Green}, {LightYellow}, {LightBlue}, {Olive}, {Lime}, {Red}, {Purple}, {Grey}, {Yellow}, {Gold}, {Silver}, {Blue}, {DarkBlue}
// {BlueGrey}, {Magenta} and {LightRed}. Make sure to end your prefix with {Default} to avoid coloring the messages in your prefix color.
matchzy_chat_prefix [{Green}TOURNLER{Default}]

// Chat prefix to show whenever an admin sends message using .asay <message>. Default value: [{Red}ADMIN{Default}]
// Avaiable Colors are mentioned above
matchzy_admin_chat_prefix [{Red}ADMIN{Default}]

// Number of seconds of delay before sending reminder messages from MatchZy (like unready message, paused message, etc).
// Default: 13 (Because each message is kept in chat for ~13 seconds)
// Note: Changing this timer wont affect the active timer, so if you change this setting in warmup, you will have to restart warmup to make the change effective
matchzy_chat_messages_timer_delay 13

// Whether playout (play max rounds) is enabled. Default value: false
// This is the default value, but playout can be toggled by admin using .playout command
matchzy_playout_enabled_default false

// Whether to kick all clients and prevent anyone from joining the server if no match is loaded. Default value: false
// This means if server is in match mode, a match needs to be set-up using matchzy_loadmatch/matchzy_loadmatch_url to load and configure a match
// Only players in that match will be able to join the server, else they will be kicked
matchzy_kick_when_no_match_loaded true

// Whether parameters from the cvars section of a match configuration are restored to their original values when a series ends.
// Default: true
matchzy_reset_cvars_on_series_end true

// Demo upload URL is set dynamically per match (not statically here) by the app's
// match-config JSON (src/lib/cs2/match-config.ts, cvars.matchzy_demo_upload_url), pushed over
// RCON via matchzy_loadmatch_url when a match starts — this way it always points at the real
// app host and the specific match's real /api/matches/<id>/demo route, rather than a hardcoded
// LAN IP baked into this static file.
// matchzy_demo_upload_url ""

// matchzy_remote_log_url / matchzy_remote_log_header_key / matchzy_remote_log_header_value
// (map/series-end event webhook -> POST /api/matches/game-state/matchzy) are set the same way,
// per-match, via cvars — not statically here.

// Whether the plugin will load the match mode, the practice mode or neither by startup. 
// 0 for neither, 1 for match mode, 2 for practice mode. Default: 1
matchzy_autostart_mode 1

// Whether nades should be saved globally instead of being privated to players by default or not. Default value: false
matchzy_save_nades_as_global_enabled false

// Whether force ready using !forceready is enabled or not (Currently works in Match Setup only). Default value: True
matchzy_allow_force_ready true

// Maximum number of grenade history that may be saved per-map, per-client. Set to 0 to disable the limit and allow unlimited grenades to be stored. Default value: 512
matchzy_max_saved_last_grenades 512

// Whether player-specific smoke color is enabled or not. Default: false
matchzy_smoke_color_enabled false

// If set to true, all the players will have admin privilege. Default: false
matchzy_everyone_is_admin false

// Whether to show 'MatchZy Plugin by WD-' message on match start. Default: true
matchzy_show_credits_on_match_start false

// --- Added by MatchZy update (missing cvars appended) ---
// Whether warmup mode is enabled. Default value: true
// If set to false, warmup.cfg will not be loaded/executed when entering warmup phases.
matchzy_warmup_enabled true

// Whether the demo upload uses HTTP PUT with the raw .dem file as the body, for S3-compatible
// storage that hands out presigned upload URLs. Default value: false (HTTP POST to a panel).
matchzy_demo_upload_s3 false

// Whether to automatically pause when a team has fewer than minimum players
// Default value: true
matchzy_autopause_enabled true

// Minimum players required per team before auto-pause triggers
// Default value: 5 (set to 2 for wingman, 4 for relaxed scrims)
matchzy_autopause_minplayers 5

// Delay in seconds before auto-resuming when teams are balanced
// Default value: 3
matchzy_autopause_resume_delay 3

// Set a fixed scoreboard teamname for the CT starting side in scrim mode.
// "" does NOT keep the game's own names: it falls back to automatic team_<playername> naming.
// To keep the vanilla scoreboard names, set matchzy_auto_team_names_enabled 0 below.
matchzy_ct_name ""

// Set a fixed scoreboard teamname for the T starting side in scrim mode.
// "" does NOT keep the game's own names: it falls back to automatic team_<playername> naming.
matchzy_t_name ""

// Whether MatchZy sets scoreboard team names in scrim mode (team_<playername>, or the two cvars
// above). 0 = MatchZy never touches team names in scrims and the game's own names stay.
// Team names from a match config (Get5/JSON, .match) are always applied regardless. Default: 1
matchzy_auto_team_names_enabled 1

// Whether the match unpauses by itself after a round restore (!restore/!stop). Default value: false
// false: the match stays paused until both teams (or an admin) use !unpause/.unpause
// true: the match unpauses on its own after matchzy_restore_unpause_delay seconds
// Requires matchzy_pause_after_restore to be enabled.
matchzy_restore_auto_unpause false

// Countdown in seconds before the automatic unpause after a round restore. Default value: 5
// Only used when matchzy_restore_auto_unpause is enabled.
matchzy_restore_unpause_delay 5

// Whether a round restore also rolls the scoreboard back to the restored round. Default value: true
// The game itself only restores the score, the round number and the money, so the round history at the
// top of the scoreboard and the player kills/deaths/assists/damage keep showing the rolled back rounds.
matchzy_restore_scoreboard_stats true

// Coach viewing-spot source: 1 = use a spawns/coach/<map>.json spot if present (hand-tuned via
// .savecoachspawn) else compute it, 2 = always compute behind the team (ignore JSON). Default: 1
matchzy_coaching_mode 1

// The server hostname to use. Set to "" to disable/use existing.
// Example matchzy_hostname_format "MatchZy | {TEAM1} vs {TEAM2}"
matchzy_hostname_format ""

// Whether to show damage report after each round or not. Default: true.
matchzy_enable_damage_report true

// Ready-status display mode. 0 = classic center text. 1 = HTML READY-UP panel (progress bar, per-player status) with the native warmup suppressed: own WARMUP badge, no native 'Warmup' pill, frozen 1:00 top timer. Default: 0
matchzy_ready_hint_style 0

// Blink the 'YOU ARE NOT READY' line on the HTML READY-UP panel to grab attention. ONLY applies when matchzy_ready_hint_style is 1 (the HTML panel); it has no effect in classic style (0). Default: false
matchzy_ready_hint_blink false

// Whether to show [READY] / [UNREADY] clan tags on the scoreboard during the ready phase. Default: true
matchzy_ready_clantag_enabled true

// Whether pinging (middle-mouse / scroll button) toggles your ready status during warmup. Set false if players ready up by accident when pinging. Default: true
matchzy_ready_up_by_ping true

// Message to show when the match starts. Use $$$ to break message into multiple lines. Set to "" to disable.
// Available variables: {TIME}, {MATCH_ID}, {MAP}, {MAPNUMBER}, {TEAM1}, {TEAM2}, {TEAM1_SCORE}, {TEAM2_SCORE}
// Available Colors: {Default}, {Darkred}, {Green}, {LightYellow}, {LightBlue}, {Olive}, {Lime}, {Red}, {Purple}, {Grey}, {Yellow}, {Gold}, {Silver}, {Blue}, {DarkBlue}
// Example: {Green} Welcome to the server! {Default} $$$ Agent models are not allowed and may lead to {Red}disqualification!{Default}
matchzy_match_start_message ""

// Whether to automatically change map after match end. Disable this for G5API/tournament matches.
// Default value: 1 (enabled)
// Set to 0 for G5API Tournament Servers (Get5 will handle map rotation)
// Note: If using G5API, this is automatically detected and disabled, but you can override here if needed
matchzy_match_end_auto_changelevel 1

// Whether MatchZy registers the css_map console command (!map). Default value: true
// MatchZy auto-yields it: if a dedicated map plugin (CS2-SimpleAdmin / CS2MapChange) is installed
// alongside, css_map is NOT registered even when this is true, avoiding a ConCommand conflict that
// can block players from connecting. Set to false to never register it.
// The .map chat command stays available regardless of this setting.
matchzy_map_console_command_enabled true

// Only matters if you added a dot as a chat trigger in CounterStrikeSharp's configs/core.json,
// for example: "PublicChatTrigger": [ "!", "." ]
// CounterStrikeSharp then already runs the console command for a dot message (.map runs css_map)
// before MatchZy sees the chat line, so MatchZy skips its own handling of those commands.
// Without this, every such command runs twice and prints its reply twice.
// Chat commands that have no console command of their own (.rdy, .knife, ...) are not affected.
// Set to false to restore the old behaviour. Default value: true
matchzy_dot_trigger_dedupe true

// Close the server (quit) when it has had no players for this many seconds. Bots and CSTV do not count;
// the count also runs from server start, so a server nobody joins is closed too. Sends the
// server_shutdown event with reason "empty" first and waits for demo and backup uploads. 0 = off.
// Default: 0
matchzy_empty_shutdown_seconds 0

// Per-team ready-up. 0 = off. N = a team is ready once N of its players typed .ready, and the match
// starts when CT and T are both ready (1 = one player per team).
// Works in pugs and loaded matches. In a loaded match the team's registered players must
// still all be on the server (or the team uses .forceready); only N of them type .ready.
// Default: 0
matchzy_ready_per_team 0

// Loaded matches: how teams get ready. 0 = players type .ready.
// 1 = join mode: a team is ready once min_players_to_ready of its players are on its side; nobody types .ready.
// Default: 0
matchzy_ready_mode 0

// Join mode only: seconds between everyone having joined and the match starting.
// Default: 10
matchzy_join_start_delay 10

// How many players a team may be short of players_per_team and still use .forceready
// (1 = at most one short, 4 in a 5v5). -1 = only the match config's min_players_to_ready.
// Default: 1
matchzy_forceready_max_missing 1

// Show each team's "tag" from the match config as the players' clan tag while live.
// Default: false
matchzy_team_clantag_enabled false

// Seconds a veto captain has for each ban, pick or side choice. When it runs out the step is made at
// random (a random map, or CT for a side choice). 0 = no limit.
// Default: 0
matchzy_veto_step_timeout 0

// Whether players can use .pause. Admin force pause is not affected.
// Default: true
matchzy_allow_pause true

// Whether players can use .unpause. Admin force unpause is not affected.
// Default: true
matchzy_allow_unpause true

// How many times each team may use .pause in each overtime period. 0 = no limit.
// Tactical timeouts (.tac) in overtime come from live.cfg (mp_team_timeout_ot_*).
// Default: 1
matchzy_overtime_pauses_per_team 1

// How a technical pause ends.
// 0 = it ends on its own after matchzy_tech_pause_duration seconds.
// 1 = Get5 rules: it never ends on its own; once it has lasted matchzy_tech_pause_duration seconds in
//     freeze time either team can .unpause, and the pausing team can cancel it before it takes effect.
// Default: 0
matchzy_tech_pause_mode 0

// Seconds after a map's ready phase begins before a team that is not ready forfeits the series.
// If neither team is ready, the series ends in a tie. 0 = off.
// Get5 panels set this as get5_time_to_start. Admins can add time with .addreadytime <seconds>.
// Default: 0
matchzy_forfeit_ready_timeout 0

// The same for the ready-up before the map veto. -1 = same as matchzy_forfeit_ready_timeout, 0 = no limit.
// Get5 name: get5_time_to_start_veto.
// Default: -1
matchzy_forfeit_veto_ready_timeout -1

// Seconds a team may have nobody on its side during a live map before it forfeits the series. 0 = off.
// Default: 0
matchzy_forfeit_leave_timeout 0

// Whether .stop becomes unavailable once a player has damaged an opponent in the current round.
// Default: false
matchzy_stop_command_no_damage false

// Loaded matches: when a player joins, show only the ready-up hint and hide the mode hints
// (.scrim / .prac / .knife) and the admin help line.
// Default: true
matchzy_loaded_match_hide_mode_hints true

// Whether players can become a coach with .coach. Coaches can only coach the team they are on.
// Default: true
matchzy_coach_enabled true

// Loaded matches: only SteamIDs in a team's "coaches" list may coach it; a team without a list has no coach.
// Default: false
matchzy_coach_listed_only false

// Keep the whole magazine on reload in practice (no ammo thrown away with the old magazine).
// Default: true
matchzy_prac_disable_magazine_drop true

// .shownades: draw a text label above each lineup beam. false = beams only.
// Default: true
matchzy_grenadelibrary_labels true

// .shownades: size of the text labels. Bigger is easier to read from a distance.
// Default: 0.2
matchzy_grenadelibrary_label_scale 0.2

// .botjiggle: how far (in units) bots strafe from side to side.
// Default: 30
matchzy_botjiggle_range 30

// Format of the live events sent to matchzy_remote_log_url (player_death, bomb_planted, player_hurt, ...).
// get5 = Get5's event schema (nested player/weapon objects, round_time). legacy = the flat format of 0.8.94 and older.
// Set the URL itself from a private cfg, not here.
// Default: get5
matchzy_events_format get5

// Whether bots on CT/T get player stats (database, CSV and stats events).
// Each bot is recorded under a stable id (90000000000000000 plus a hash of its name).
// Default: false
matchzy_stats_include_bots false

// Whether MatchZy handles the css_asay console command (!asay). The .asay chat command always works.
// Set false if another plugin such as CS2-SimpleAdmin owns css_asay, to avoid double messages.
// Default: true
matchzy_asay_console_enabled true

