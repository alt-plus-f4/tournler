name: PR checks

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

# Every env var below is a throwaway value scoped to this ephemeral CI run (fake secret, local-only
# DB, localhost URL) — none of it touches anything real, so none of it needs to be a GitHub secret.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tournler_ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tournler_ci?schema=public
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-real
  DISCORD_CLIENT_ID: ci-placeholder
  DISCORD_CLIENT_SECRET: ci-placeholder
  DISCORD_BOT_TOKEN: ci-placeholder
  DISCORD_GUILD_ID: ci-placeholder
  STEAM_API_KEY: ci-placeholder
  STEAM_REDIRECT_URI: http://localhost:3000/api/auth/steam/callback
  BLOB_READ_WRITE_TOKEN: ci-placeholder
  EMAIL_SERVER_USER: ci-placeholder
  EMAIL_SERVER_PASSWORD: ci-placeholder
  EMAIL_SERVER_HOST: localhost
  EMAIL_SERVER_PORT: '587'
  EMAIL_FROM: noreply@example.com

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tournler_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply schema to the CI database
        run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - name: Build
        run: npm run build

      - name: Start the app and run Unlighthouse
        run: |
          npm run start -- -p 3000 &
          server_pid=$!
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          npx --yes unlighthouse-ci \
            --site http://localhost:3000 \
            --urls /,/tournaments,/matches,/teams,/news,/forum,/information,/privacy,/terms \
            --budget 50 \
            --reporter jsonExpanded \
            --output-path .unlighthouse-ci
          exit_code=$?
          kill "$server_pid" || true
          exit $exit_code

      - name: Upload Unlighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlighthouse-report
          path: .unlighthouse-ci
          retention-days: 14
